services:
  # 🔥 1. NAYI DATABASE SERVICE (Postgres)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: splitwise_db
      POSTGRES_USER: splitwise_admin
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitwise_admin -d splitwise_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1. Backend Service
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  # 2. Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
volumes:
  postgres_data:
