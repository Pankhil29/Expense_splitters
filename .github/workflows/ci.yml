name: Splitwise Secure Pro CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: splitwise_db
          POSTGRES_USER: splitwise_admin
          POSTGRES_PASSWORD: mysecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 🎯 FIX: GitHub Actions ke environment me ek temporary dummy .env file create karenge
      - name: Create Dummy .env File for django-environ
        run: |
          echo "SECRET_KEY=django-insecure-test-key-for-github-actions-pipeline-123" >> backend/.env
          echo "DB_HOST=localhost" >> backend/.env
          echo "DB_NAME=splitwise_db" >> backend/.env
          echo "DB_USER=splitwise_admin" >> backend/.env
          echo "DB_PASSWORD=mysecretpassword" >> backend/.env
          echo "DB_PORT=5432" >> backend/.env

      - name: Run Django Automation Tests 🧪
        run: |
          cd backend
          python manage.py test

      - name: Verify Docker Compose Configuration 🐳
        run: |
          docker-compose build
