name: Splitwise Secure Pro CI Pipeline

# Pipeline kab chalegi? Jab bhi tum main branch par code push ya PR karoge
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Database setup for testing inside GitHub Runner
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: splitwise_db # 👈 Tumhara actual DB Name
          POSTGRES_USER: splitwise_admin # 👈 Tumhara actual DB User
          POSTGRES_PASSWORD: mysecretpassword # 👈 Tumhara actual DB Password
        ports:
          - 5432:5432
        # Check ki postgres ready ho jaye
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Code pull karo runner par
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Python Setup karo
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Dependencies install karo
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. Run Django Tests (Yahan database host localhost hoga pipeline me)
      - name: Run Django Automation Tests 🧪
        env:
          SECRET_KEY: "django-insecure-test-key-for-github-actions-pipeline-123"
          DB_HOST: localhost # 👈 IMPORTANT FIX: Ise 'localhost' hi rakhna hai GitHub Actions ke liye!
          DB_NAME: splitwise_db # 👈 Tumhara actual DB Name
          DB_USER: splitwise_admin # 👈 Tumhara actual DB User
          DB_PASSWORD: mysecretpassword # 👈 Tumhara actual DB Password
          DB_PORT: 5432
        run: |
          cd backend
          python manage.py test

      # 5. Verify Docker Compose Build
      - name: Verify Docker Compose Configuration 🐳
        run: |
          docker-compose build
